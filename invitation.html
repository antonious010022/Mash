<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يوسف وأسماء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600&family=Reem+Kufi:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#26301f;
    --cream:#f6efdd;
    --cream-2:#efe4c8;
    --green-deep:#243a2b;
    --green-mid:#3c5a41;
    --gold:#b8905a;
    --gold-light:#d9b877;
    --gold-line: rgba(184,144,90,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background: radial-gradient(circle at 50% -10%, #2f4634 0%, var(--green-deep) 55%, #182619 100%);
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    overflow-x:hidden;
  }

  /* ambient floating motes */
  .mote{
    position:fixed;
    border-radius:50%;
    background: var(--gold-light);
    opacity:0.12;
    filter:blur(1px);
    animation: float 14s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) translateX(0); }
    50%{ transform: translateY(-24px) translateX(10px); }
  }

  .card{
    position:relative;
    width:100%;
    max-width:480px;
    background: var(--cream);
    border-radius:6px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(184,144,90,0.25);
    padding:0;
    overflow:hidden;
    opacity:0;
    transform: translateY(24px) scale(0.985);
    animation: rise 1s cubic-bezier(.19,1,.22,1) forwards;
  }
  @keyframes rise{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .inner-frame{
    margin:14px;
    border:1px solid var(--gold-line);
    border-radius:2px;
    position:relative;
    padding:38px 26px 34px;
  }

  /* corner ornaments */
  .corner{
    position:absolute;
    width:46px;
    height:46px;
    opacity:0.85;
  }
  .corner svg{width:100%;height:100%;display:block;}
  .corner.tl{top:-1px; right:-1px; transform:scaleX(-1);}
  .corner.tr{top:-1px; left:-1px;}
  .corner.bl{bottom:-1px; right:-1px; transform:scale(-1,-1);}
  .corner.br{bottom:-1px; left:-1px; transform:scaleY(-1);}

  .bismillah{
    text-align:center;
    font-family:'Reem Kufi', sans-serif;
    color:var(--green-mid);
    font-size:15px;
    letter-spacing:0.5px;
    margin:0 0 20px;
    opacity:0.9;
  }

  .divider-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:0 0 22px;
  }
  .divider-top .line{
    height:1px;
    width:38px;
    background: var(--gold-line);
  }
  .divider-top .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--gold);
  }

  .ayah{
    text-align:center;
    font-family:'Aref Ruqaa', serif;
    font-size:21px;
    line-height:2;
    color:var(--green-deep);
    margin:0 0 30px;
    padding:0 6px;
  }

  /* names + photo medallion */
  .medallion-wrap{
    display:flex;
    justify-content:center;
    margin: 6px 0 22px;
  }
  .medallion{
    position:relative;
    width:168px;
    height:168px;
  }
  .medallion .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
  }
  .medallion .ring.outer{
    background: conic-gradient(from 0deg, var(--gold-light), var(--gold), var(--gold-light), var(--gold), var(--gold-light));
    padding:3px;
  }
  .medallion .ring.outer .mask{
    width:100%;height:100%;border-radius:50%;
    background:var(--cream);
  }
  .medallion .photo{
    position:absolute;
    inset:9px;
    border-radius:50%;
    overflow:hidden;
    background:
      radial-gradient(circle at 30% 25%, #4a6650 0%, #2f4634 55%, #1f321f 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .medallion .photo img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .medallion .photo .placeholder-mark{
    font-family:'Aref Ruqaa', serif;
    color: var(--gold-light);
    font-size:13px;
    text-align:center;
    opacity:0.8;
    padding:0 14px;
    line-height:1.6;
  }
  .medallion .sparkle{
    position:absolute;
    width:8px;height:8px;
    background:var(--gold-light);
    border-radius:50%;
    box-shadow:0 0 8px 2px rgba(217,184,119,0.6);
  }
  .medallion .sparkle.s1{ top:-2px; right:30px; }
  .medallion .sparkle.s2{ bottom:6px; left:-2px; }

  .names{
    text-align:center;
    margin: 0 0 4px;
  }
  .names .name{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:40px;
    color:var(--green-deep);
    line-height:1.25;
    display:block;
  }
  .names .amp{
    font-family:'Aref Ruqaa', serif;
    color:var(--gold);
    font-size:22px;
    display:block;
    margin:2px 0;
    position:relative;
  }
  .names .amp:before,
  .names .amp:after{
    content:'';
    position:absolute;
    top:50%;
    width:34px;
    height:1px;
    background:var(--gold-line);
  }
  .names .amp:before{ right:calc(50% + 22px); }
  .names .amp:after{ left:calc(50% + 22px); }

  .divider-mid{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:26px 0 26px;
  }
  .divider-mid .line{
    height:1px;
    flex:1;
    max-width:70px;
    background:var(--gold-line);
  }
  .divider-mid .motif{
    color:var(--gold);
    font-size:14px;
  }

  .details{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:26px;
  }
  .detail-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    justify-content:center;
    text-align:center;
    flex-direction:column;
  }
  .detail-row .label{
    font-family:'Reem Kufi', sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--gold);
    text-transform:uppercase;
  }
  .detail-row .value{
    font-size:17px;
    font-weight:600;
    color:var(--green-deep);
    line-height:1.6;
  }
  .detail-row .sub{
    font-size:13.5px;
    color:#5c6b56;
    font-weight:400;
  }

  .cta{
    display:block;
    text-align:center;
    text-decoration:none;
    background: linear-gradient(135deg, var(--green-mid), var(--green-deep));
    color: var(--cream);
    font-family:'Cairo', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:14px 20px;
    border-radius:3px;
    letter-spacing:0.3px;
    box-shadow:0 8px 22px rgba(36,58,43,0.35);
    transition: transform .25s ease, box-shadow .25s ease;
    position:relative;
  }
  .cta:hover{ transform: translateY(-2px); box-shadow:0 12px 28px rgba(36,58,43,0.45); }
  .cta:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .cta .icon{ margin-inline-start:8px; }

  .footer-note{
    text-align:center;
    margin-top:22px;
    font-size:12.5px;
    color:#7a8572;
    letter-spacing:0.4px;
  }

  @media (max-width:380px){
    .names .name{ font-size:33px; }
    .ayah{ font-size:18px; }
    .medallion{ width:140px; height:140px; }
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    .mote{ animation:none; }
  }
</style>
</head>
<body>

<div class="mote" style="width:120px;height:120px; top:8%; left:6%;"></div>
<div class="mote" style="width:80px;height:80px; bottom:12%; right:8%; animation-delay:3s;"></div>
<div class="mote" style="width:60px;height:60px; top:60%; left:-2%; animation-delay:6s;"></div>

<div class="card">
  <div class="inner-frame">

    <div class="corner tl"><svg viewBox="0 0 46 46"><path d="M2 44 C2 20 20 2 44 2" stroke="#b8905a" stroke-width="1.4" fill="none"/><circle cx="44" cy="2" r="2.4" fill="#b8905a"/></svg></div>
    <div class="corner tr"><svg viewBox="0 0 46 46"><path d="M2 44 C2 20 20 2 44 2" stroke="#b8905a" stroke-width="1.4" fill="none"/><circle cx="44" cy="2" r="2.4" fill="#b8905a"/></svg></div>
    <div class="corner bl"><svg viewBox="0 0 46 46"><path d="M2 44 C2 20 20 2 44 2" stroke="#b8905a" stroke-width="1.4" fill="none"/><circle cx="44" cy="2" r="2.4" fill="#b8905a"/></svg></div>
    <div class="corner br"><svg viewBox="0 0 46 46"><path d="M2 44 C2 20 20 2 44 2" stroke="#b8905a" stroke-width="1.4" fill="none"/><circle cx="44" cy="2" r="2.4" fill="#b8905a"/></svg></div>

    <p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>

    <div class="divider-top">
      <span class="line"></span><span class="dot"></span><span class="line"></span>
    </div>

    <p class="ayah">﴿ وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ﴾</p>

    <div class="medallion-wrap">
      <div class="medallion">
        <div class="ring outer">
          <div class="mask"></div>
        </div>
        <div class="photo" id="couplePhoto">
          <span class="placeholder-mark">أرسل لي الصورة<br>وسأضعها هنا</span>
        </div>
        <span class="sparkle s1"></span>
        <span class="sparkle s2"></span>
      </div>
    </div>

    <div class="names">
      <span class="name">يُوسُف</span>
      <span class="amp">و</span>
      <span class="name">أَسْمَاء</span>
    </div>

    <div class="divider-mid">
      <span class="line"></span><span class="motif">✦</span><span class="line"></span>
    </div>

    <div class="details">
      <div class="detail-row">
        <span class="label">المكان</span>
        <span class="value">بانوراما 6 أكتوبر</span>
        <span class="sub">قاعة الماسة — صلاح سالم</span>
      </div>
      <div class="detail-row">
        <span class="label">الموعد</span>
        <span class="value">الأربعاء، 9 سبتمبر 2026</span>
        <span class="sub">الساعة 8:00 مساءً</span>
      </div>
    </div>

    <a class="cta" href="https://maps.app.goo.gl/bNy5sfxUNrCXYStA8" target="_blank" rel="noopener">
      افتح الموقع على الخريطة <span class="icon">↝</span>
    </a>

    <p class="footer-note">بحضوركم تكتمل فرحتنا</p>

  </div>
</div>

</body>
</html>
