<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يوسف وأسماء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600&family=Reem+Kufi:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-deep:#3a060d;
    --maroon-mid:#63121f;
    --maroon-line: rgba(184,137,79,0.55);
    --gold:#b8894f;
    --gold-light:#e0c08a;
    --gold-dark:#8a5a26;
    --cream:#f7ecd9;
    --cream-2:#f0dcc0;
    --ink:#3a2415;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background: radial-gradient(circle at 50% -10%, #4a0e17 0%, var(--maroon-deep) 55%, #1c0306 100%);
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    overflow-x:hidden;
  }

  .mote{
    position:fixed;
    border-radius:50%;
    background: var(--gold-light);
    opacity:0.10;
    filter:blur(1px);
    animation: float 14s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) translateX(0); }
    50%{ transform: translateY(-24px) translateX(10px); }
  }

  .card{
    position:relative;
    width:100%;
    max-width:460px;
    background: var(--cream);
    border-radius:8px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(184,137,79,0.3);
    overflow:hidden;
    opacity:0;
    transform: translateY(24px) scale(0.985);
    animation: rise 1s cubic-bezier(.19,1,.22,1) forwards;
  }
  @keyframes rise{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  /* ---- hero: uploaded photo, with names set into its blank archway ---- */
  .hero{
    position:relative;
    width:100%;
    aspect-ratio: 768 / 1354;
    overflow:hidden;
  }
  .hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: top center;
    display:block;
  }

  .hero .bismillah{
    position:absolute;
    top:29.5%;
    left:0; right:0;
    text-align:center;
    font-family:'Reem Kufi', sans-serif;
    color:var(--gold-dark);
    font-size:13px;
    letter-spacing:0.6px;
    opacity:0.92;
  }

  .hero .names{
    position:absolute;
    top:35%;
    left:0; right:0;
    text-align:center;
  }
  .hero .names .name{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:clamp(30px, 8.6vw, 40px);
    color:var(--maroon-deep);
    line-height:1.22;
    display:block;
  }
  .hero .names .amp{
    font-family:'Aref Ruqaa', serif;
    color:var(--gold-dark);
    font-size:19px;
    display:block;
    margin:1px 0;
    position:relative;
  }
  .hero .names .amp:before,
  .hero .names .amp:after{
    content:'';
    position:absolute;
    top:50%;
    width:26px;
    height:1px;
    background: var(--maroon-line);
  }
  .hero .names .amp:before{ right:calc(50% + 18px); }
  .hero .names .amp:after{ left:calc(50% + 18px); }

  /* ---- info panel below the photo ---- */
  .panel{
    position:relative;
    padding:30px 26px 30px;
    border-top:1px solid var(--maroon-line);
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:0 0 20px;
  }
  .divider .line{
    height:1px;
    width:36px;
    background:var(--maroon-line);
  }
  .divider .motif{
    color:var(--gold-dark);
    font-size:13px;
  }

  .ayah{
    text-align:center;
    font-family:'Aref Ruqaa', serif;
    font-size:19px;
    line-height:1.9;
    color:var(--maroon-mid);
    margin:0 0 24px;
    padding:0 4px;
  }

  .details{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:24px;
  }
  .detail-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:4px;
  }
  .detail-row .label{
    font-family:'Reem Kufi', sans-serif;
    font-size:11px;
    letter-spacing:1.6px;
    color:var(--gold-dark);
    text-transform:uppercase;
  }
  .detail-row .value{
    font-size:17px;
    font-weight:600;
    color:var(--maroon-deep);
    line-height:1.6;
  }
  .detail-row .sub{
    font-size:13.5px;
    color:#7a5e4c;
    font-weight:400;
  }

  .cta{
    display:block;
    text-align:center;
    text-decoration:none;
    background: linear-gradient(135deg, var(--maroon-mid), var(--maroon-deep));
    color: var(--cream);
    font-family:'Cairo', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:14px 20px;
    border-radius:4px;
    letter-spacing:0.3px;
    box-shadow:0 8px 22px rgba(58,6,13,0.35);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .cta:hover{ transform: translateY(-2px); box-shadow:0 12px 28px rgba(58,6,13,0.45); }
  .cta:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .cta .icon{ margin-inline-start:8px; }

  /* ---- music toggle ---- */
  .music-row{
    display:flex;
    justify-content:center;
    margin-top:20px;
  }
  .music-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background: transparent;
    border:1px solid var(--maroon-line);
    color:var(--maroon-mid);
    font-family:'Cairo', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .music-btn:hover{ background: rgba(184,137,79,0.12); }
  .music-btn .dot{
    width:7px;height:7px;border-radius:50%;
    background: var(--gold-dark);
  }
  .music-btn.playing .dot{
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.4; transform:scale(1.4); }
  }

  .sound-hint{
    position:fixed;
    left:50%;
    bottom:18px;
    transform: translateX(-50%);
    background: var(--maroon-deep);
    color: var(--cream);
    font-family:'Cairo', sans-serif;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity .3s ease;
    z-index:20;
    white-space:nowrap;
  }
  .sound-hint.show{
    opacity:1;
    pointer-events:auto;
  }

  .footer-note{
    text-align:center;
    margin-top:22px;
    font-size:12.5px;
    color:#8a6f5c;
    letter-spacing:0.4px;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    .mote{ animation:none; }
  }
</style>
</head>
